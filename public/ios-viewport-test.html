<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1f4ec"><title>iPhone 视口复现测试</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8ece3;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#294538}.screen{height:100dvh;display:flex;flex-direction:column;background:#fafbf7}.head{padding:calc(env(safe-area-inset-top) + 16px) 20px 16px;background:#e7eee3}.head strong{display:block;font-size:18px}.main{flex:1;min-height:0;padding:20px}.nav{flex:none;background:white;border-top:2px solid #294538;padding:12px 10px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-around}.nav span{font-size:14px}.marker{height:6px;background:#e34242}.readout{white-space:pre-wrap;font:12px ui-monospace,monospace;background:#fff;padding:14px;border-radius:10px;overflow-wrap:anywhere}.mode{margin-top:12px;padding:8px;border-radius:8px;background:#dde7d8}</style></head><body><div class="screen" id="screen"><div class="head"><strong>iOS 底部空白 · 最小复现</strong><small>独立诊断页面，不读取聊天数据</small></div><main class="main"><div class="readout" id="report">测量中…</div><div class="mode">红色线应贴近屏幕底部导航栏之上；导航栏下方仅保留系统安全区。</div></main><nav class="nav"><span>聊天</span><span>联系人</span><span>朋友圈</span><span>设置</span></nav><div class="marker"></div></div><script>function measure(){let s=document.getElementById('screen').getBoundingClientRect(),m=document.querySelector('.marker').getBoundingClientRect(),v=visualViewport;document.getElementById('report').textContent=JSON.stringify({build:'ios-minimal-v1',innerHeight,clientHeight:document.documentElement.clientHeight,visualHeight:v?.height,visualOffset:v?.offsetTop,screenBottom:s.bottom,markerBottom:m.bottom,screenGap:innerHeight-m.bottom,standalone:matchMedia('(display-mode:standalone)').matches,navStandalone:navigator.standalone,safeBottom:getComputedStyle(document.querySelector('.nav')).paddingBottom},null,2)}addEventListener('resize',measure);visualViewport?.addEventListener('resize',measure);addEventListener('pageshow',measure);requestAnimationFrame(measure)</script></body></html>
