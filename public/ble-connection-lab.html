<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Claudia Phone · 蓝牙连接实验室</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f7fc;color:#242331;max-width:680px;margin:auto;padding:24px 18px}h1{font-size:24px}.panel{background:white;border:1px solid #e6e3ee;border-radius:16px;padding:18px;margin:16px 0}button{background:#4946a9;color:white;border:0;border-radius:12px;padding:14px 18px;font-size:16px;margin:6px 6px 6px 0}button:disabled{background:#aaa}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f1f6;padding:12px;border-radius:10px;min-height:100px}.note{background:#fff2d9;border-radius:12px;padding:14px;line-height:1.7}.status{font-weight:700}small{color:#686579}</style></head><body><p><a href="/" style="color:#4946a9;text-decoration:none;font-weight:600">‹ 返回 Claudia Phone</a></p><h1>Claudia Phone · 蓝牙连接实验室</h1><div class="note">独立只读蓝牙模块。不会读取特征值、写入指令或启动设备。设备请勿在使用中，先断开官方 App。此页不是小游戏控制功能。</div><div class="panel"><p>浏览器：<span id="support">检查中</span></p><p>状态：<span id="status" class="status">未连接</span></p><p>设备：<span id="device">—</span></p><button id="connect">连接 SOSEXY</button><button id="disconnect" disabled>断开</button><p><small>请在 Bluefy 中打开。选择设备列表里只选择自己的 SOSEXY。</small></p></div><div class="panel" id="control-panel"><h2>设备响应测试</h2><p><small>蓝牙连接不等于控制协议已确认。只有核实震动与停止指令后才能启用。</small></p><button id="pulse" disabled aria-label="震动测试，待协议验证">震动测试 · 1 秒（待验证）</button><button id="stop" disabled aria-label="停止设备，待协议验证">停止设备（待验证）</button><p id="control-status" role="status"><small>当前未发送任何控制指令。请勿佩戴设备进行测试。</small></p></div><div class="panel"><h2>服务与特征（元信息）</h2><pre id="log">等待手动连接。</pre></div><script>(()=>{const ee='0000ee01-0000-1000-8000-00805f9b34fb',ae='0000ae00-0000-1000-8000-00805f9b34fb';const el=id=>document.getElementById(id);let device;const log=s=>el('log').textContent+='\n'+s;const state=(connected)=>{el('control-status').textContent=connected?'蓝牙已连接；控制协议尚未确认，震动和停止按钮保持禁用。':'未连接；未发送控制指令。';el('connect').disabled=connected;el('disconnect').disabled=!connected;el('status').textContent=connected?'已连接':'未连接'};el('support').textContent=navigator.bluetooth?.requestDevice?'支持 Web Bluetooth':'不支持 Web Bluetooth（请用 Bluefy）';function lost(){state(false);log('连接已断开')}el('connect').onclick=()=>{if(!navigator.bluetooth?.requestDevice){log('此浏览器不支持 requestDevice');return}el('connect').disabled=true;el('log').textContent='请求选择蓝牙设备…';let req;try{req=navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[ee,ae]})}catch(e){log('请求失败：'+String(e));state(false);return}Promise.resolve(req).then(async d=>{device=d;el('device').textContent=d.name||'未命名';if(d.name!=='SOSEXY'){log('设备名称不是 SOSEXY，未连接。');state(false);return}d.addEventListener('gattserverdisconnected',lost);log('连接 GATT…');const server=await d.gatt.connect();state(true);log('GATT 已连接');for(const s of await server.getPrimaryServices()){log('服务 '+s.uuid);try{for(const c of await s.getCharacteristics()){const p=c.properties;log('  特征 '+c.uuid+' ['+['read','notify','indicate','write','writeWithoutResponse'].filter(k=>p[k]).join(', ')+']')}}catch(e){log('特征枚举失败：'+String(e))}}log('只读元信息检查完成。')} ).catch(e=>{log('错误：'+String(e));state(false)})};el('disconnect').onclick=()=>{if(device?.gatt?.connected)device.gatt.disconnect();state(false)};window.addEventListener('pagehide',()=>{if(device?.gatt?.connected)device.gatt.disconnect()})})();</script></body></html>
