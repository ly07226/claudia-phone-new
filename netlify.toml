[build]
  ignore = "node -e \"process.exit(process.env.BRANCH==='feature/dual-automation-api'?0:1)\""
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/qq/qr/start"
  to = "/.netlify/functions/qq-qr"
  status = 200

[[redirects]]
  from = "/api/qq/qr/:attemptId"
  to = "/.netlify/functions/qq-qr?attemptId=:attemptId"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
