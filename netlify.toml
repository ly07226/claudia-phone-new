[build]
  ignore = "node ./scripts/automation-build-policy.mjs ignore"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/sticker-image"
  to = "/.netlify/functions/sticker-image"
  status = 200
  force = true

[[redirects]]
  from = "/api/qq/qr/start"
  to = "/.netlify/functions/qq-qr"
  status = 200

[[redirects]]
  from = "/api/qq/qr/:attemptId"
  to = "/.netlify/functions/qq-qr?attemptId=:attemptId"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
