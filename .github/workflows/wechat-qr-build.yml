name: WeChat QR dependency lock and build
on:
  push:
    branches:
      - feature/wechat-ilink-main-refresh
    paths:
      - .github/workflows/wechat-qr-build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve QR dependency and lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript and Vite build
        run: npm run build
      - name: Commit resolved lockfile only after successful build
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(wechat): sync QR dependency lockfile after build"
            git push origin HEAD:feature/wechat-ilink-main-refresh
          fi
