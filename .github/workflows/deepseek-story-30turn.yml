name: DeepSeek 30-turn story stress test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  story-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated live-model stress test
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/deepseek-story-30turn.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-story-30turn-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
