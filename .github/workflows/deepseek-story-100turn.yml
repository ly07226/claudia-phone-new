name: DeepSeek production agency live acceptance
# Player-agency E-action retest 2026-11-13; test script checked out from test/deepseek-story-30turn.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deepseek-story-100turn.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  live-choice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-player-agency-length
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate 3 production-prompt DeepSeek scenarios
        id: test
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/story-agency-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-agency-live-results
          path: artifacts/story-agency-live.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish report directly as GitHub issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('artifacts/story-agency-live.json')
          if not p.exists(): raise SystemExit('Test produced no result file')
          s=json.loads(p.read_text())
          lines=['# DeepSeek production player-agency acceptance','',f"Source: {s.get('source')}",f"Timestamp: {s.get('timestamp')}",'','Real model outputs below; manually inspect player agency and forced plot redirection.','']
          for h in s.get('results',[]):
            lines.extend([f"### {h.get('scenario')}",f"Characters: {h.get('length')}; target met: {h.get('withinTarget')}; choices: {h.get('choices')}",'',h.get('body',''),'',f"Choices: {h.get('choiceTexts')}",''])
          pathlib.Path('/tmp/story100.md').write_text('\n'.join(lines))
          PY
          gh issue create -R "$GH_REPO" -t "DeepSeek agency acceptance run $GITHUB_RUN_ID" -F /tmp/story100.md
      - name: Fail if generation incomplete
        if: steps.test.outcome == 'failure'
        run: exit 1
