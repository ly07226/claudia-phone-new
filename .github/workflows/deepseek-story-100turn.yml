name: DeepSeek production agency live acceptance
# 100-turn sequential acceptance run; checkout fix/story-player-agency-length at latest commit.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deepseek-story-100turn.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  live-choice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-player-agency-length
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate 100 sequential production-prompt DeepSeek turns
        id: test
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/story-agency-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-agency-live-results
          path: artifacts/story-agency-live.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish report directly as GitHub issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('artifacts/story-agency-live.json')
          if not p.exists(): raise SystemExit('Test produced no result file')
          s=json.loads(p.read_text())
          results=s.get('results',[])
          lines=['# DeepSeek 100-turn sequential player-agency test','',f"Source: {s.get('source')}",f"Timestamp: {s.get('timestamp')}",f"Completed: {len(results)}/100",f"Invalid JSON or choices: {sum(not h.get('validJson') or h.get('choices')!=4 for h in results)}",f"Under 800 chars: {sum(h.get('length',0)<800 for h in results)}",'','The full unabridged text for all turns is in the Actions artifact story-agency-live-results (JSON).','']
          for h in results:
            lines.append(f"Turn {h.get('turn')} / {h.get('arc')} #{h.get('arcTurn')}: {h.get('length')} chars; {h.get('choices')} choices; error={h.get('error')}")
          lines.extend(['','## Full text sample (first 5 turns)'])
          for h in results[:5]:
            lines.extend([f"### Turn {h.get('turn')}",'',h.get('body',''),'',f"Choices: {h.get('choiceTexts')}",''])
          pathlib.Path('/tmp/story100.md').write_text('\n'.join(lines))
          PY
          gh issue create -R "$GH_REPO" -t "DeepSeek agency acceptance run $GITHUB_RUN_ID" -F /tmp/story100.md
      - name: Fail if generation incomplete
        if: steps.test.outcome == 'failure'
        run: exit 1
